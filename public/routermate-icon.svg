<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="cyberBg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#091b33" />
      <stop offset="50%" stop-color="#050e1c" />
      <stop offset="100%" stop-color="#030811" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="60" y1="60" x2="450" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="120" y1="120" x2="390" y2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#cyberBg)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="4"/>
  
  <!-- Subtly pulsing ambient back glow -->
  <circle cx="256" cy="256" r="140" fill="url(#cyanGrad)" opacity="0.12" filter="blur(40px)"/>
  
  <!-- Outer Wi-Fi Wave 3 -->
  <path d="M120 180 C195 110, 317 110, 392 180" stroke="url(#cyanGrad)" stroke-width="26" stroke-linecap="round" opacity="0.85" filter="url(#neonGlow)"/>
  
  <!-- Middle Wi-Fi Wave 2 -->
  <path d="M165 225 C215 175, 297 175, 347 225" stroke="url(#cyanGrad)" stroke-width="24" stroke-linecap="round" opacity="0.95"/>
  
  <!-- Inner Wi-Fi Wave 1 -->
  <path d="M210 270 C235 242, 277 242, 302 270" stroke="url(#accentGrad)" stroke-width="20" stroke-linecap="round"/>
  
  <!-- Center Router / Shield Core -->
  <g transform="translate(0, 10)">
    <!-- Base router chassis -->
    <path d="M150 330 L362 330 C378 330, 390 342, 386 358 L374 402 C370 416, 356 426, 342 426 L170 426 C156 426, 142 416, 138 402 L126 358 C122 342, 134 330, 150 330 Z" 
          fill="#0c1d34" stroke="url(#cyanGrad)" stroke-width="7"/>
    
    <!-- Router ventilation / high-tech accent band -->
    <path d="M160 366 L352 366" stroke="rgba(56, 189, 248, 0.35)" stroke-width="4" stroke-linecap="round"/>
    
    <!-- LED Indicators -->
    <circle cx="190" cy="392" r="7" fill="#4ade80" filter="url(#neonGlow)"/>
    <circle cx="230" cy="392" r="6" fill="#38bdf8"/>
    <circle cx="270" cy="392" r="6" fill="#38bdf8"/>
    <circle cx="310" cy="392" r="6" fill="#00f2fe"/>
    
    <!-- Dual high-gain antennas pointing outward -->
    <path d="M160 330 L118 240 C114 230, 122 220, 132 222 L146 226" stroke="url(#cyanGrad)" stroke-width="12" stroke-linecap="round"/>
    <path d="M352 330 L394 240 C398 230, 390 220, 380 222 L366 226" stroke="url(#cyanGrad)" stroke-width="12" stroke-linecap="round"/>
  </g>
</svg>
