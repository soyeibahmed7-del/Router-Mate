<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" fill="none">
  <defs>
    <linearGradient id="cyanGradLockup" x1="0" y1="0" x2="160" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="textGrad" x1="160" y1="0" x2="480" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f0f9ff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="mateGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glowLockup" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left Icon Mark -->
  <g transform="translate(16, 16)">
    <!-- Base squircle -->
    <rect x="0" y="0" width="128" height="128" rx="32" fill="#08182d" stroke="rgba(56, 189, 248, 0.4)" stroke-width="2.5"/>
    
    <!-- Wi-Fi Waves -->
    <path d="M28 50 C44 32, 84 32, 100 50" stroke="url(#cyanGradLockup)" stroke-width="8" stroke-linecap="round"/>
    <path d="M40 64 C52 50, 76 50, 88 64" stroke="url(#cyanGradLockup)" stroke-width="7" stroke-linecap="round"/>
    <path d="M52 78 C58 72, 70 72, 76 78" stroke="#4ade80" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Chassis -->
    <path d="M36 94 L92 94 L87 114 L41 114 Z" fill="#0f294a" stroke="url(#cyanGradLockup)" stroke-width="3"/>
    
    <!-- LEDs -->
    <circle cx="48" cy="104" r="2.5" fill="#4ade80" filter="url(#glowLockup)"/>
    <circle cx="58" cy="104" r="2" fill="#38bdf8"/>
    <circle cx="68" cy="104" r="2" fill="#38bdf8"/>
    <circle cx="78" cy="104" r="2" fill="#00f2fe"/>
  </g>

  <!-- Right Typography -->
  <text x="168" y="92" font-family="'Sora', 'Inter', sans-serif" font-size="54" font-weight="800" letter-spacing="-1.5" fill="#ffffff">
    Router<tspan fill="url(#mateGrad)" font-style="italic">Mate</tspan>
  </text>
  
  <!-- Subtitle badge -->
  <text x="170" y="122" font-family="'IBM Plex Mono', monospace" font-size="12" font-weight="600" letter-spacing="4" fill="#38bdf8" opacity="0.9">
    SMART WI-FI INTELLIGENCE
  </text>
  <circle cx="396" cy="118" r="3" fill="#4ade80" />
  <text x="406" y="122" font-family="'IBM Plex Mono', monospace" font-size="11" font-weight="500" letter-spacing="1" fill="#4ade80" opacity="0.95">
    ONLINE
  </text>
</svg>
